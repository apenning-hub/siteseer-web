backend:
  name: github
  repo: apenning-hub/siteseer-web
  branch: main
  # The OAuth broker (functions/api/auth) is served from the education site;
  # the industry site's /admin signs in through it too.
  base_url: https://education.siteseer.education
  auth_endpoint: api/auth

# Direct commits to main. Editorial workflow is deliberately OFF — the owner
# asked to be out of the publishing loop.
publish_mode: simple

media_folder: public/images/blog
public_folder: /images/blog

collections:
  # ---------------------------------------------------------------------
  # Blog posts — src/content/blog/*.md, validated by the `blog` schema in
  # src/content.config.ts.
  # ---------------------------------------------------------------------
  - name: blog
    label: Blog posts
    label_singular: Blog post
    folder: src/content/blog
    create: true
    extension: md
    format: frontmatter
    fields:
      - name: title
        label: Title
        widget: string
        hint: The headline shown at the top of the post and in the blog list.

      - name: description
        label: Summary
        widget: text
        hint: >-
          A one or two sentence summary. Shown on the blog listing page and
          wherever the post is shared as a link.

      - name: pubDate
        label: Publish date
        widget: datetime
        hint: The date shown on the post. Newer posts appear first in the list.

      - name: updatedDate
        label: Last updated
        widget: datetime
        required: false
        hint: >-
          Optional. Only fill this in if you're revising an already-published
          post and want to show it was updated.

      - name: tags
        label: Tags
        widget: list
        required: false
        hint: >-
          Optional. One tag per line, for example "construction" or "unreal
          engine". Leave empty if you don't want to add any.

      - name: author
        label: Author
        widget: string
        default: SiteSeer
        hint: Who wrote this post.

      - name: audience
        label: Show on
        widget: select
        multiple: true
        options:
          - { label: Education site, value: education }
          - { label: Industry site, value: industry }
        default: [education, industry]
        hint: Which site lists this post. Pick one or both.

      - name: image
        label: Image
        widget: string
        required: false
        hint: >-
          A render file from src/images/renders, e.g. render-20.jpg. Shown on
          the blog card and above the post.

      - name: imageAlt
        label: Image description
        widget: string
        required: false
        hint: What the image shows, for people who cannot see it.

      - name: draft
        label: Draft
        widget: boolean
        default: true
        hint: >-
          Drafts are never published. Untick when the post is ready to go
          live.

      - name: body
        label: Post content
        widget: markdown
        hint: The main text of the post. Use the toolbar for headings, links, lists and images.

  # ---------------------------------------------------------------------
  # Each site's homepage copy (src/content/sites/*.json) and the shared
  # partner list, validated by the `sites` and `partners` schemas in
  # src/content.config.ts. Both site files share one field tree.
  # ---------------------------------------------------------------------
  - name: sites
    label: Site pages
    files:
      - name: education
        label: Education site
        file: src/content/sites/education.json
        fields: &a7
          - name: draft
            label: Draft copy
            widget: boolean
            hint: Shows a "Draft copy" note in the footer while the copy is under review.
          - name: meta
            label: Search and sharing
            widget: object
            collapsed: true
            fields:
              - name: title
                label: Page title
                widget: string
              - name: description
                label: Description
                widget: text
          - name: nav
            label: Header
            widget: object
            collapsed: true
            fields:
              - name: cta
                label: Button label
                widget: string
          - name: hero
            label: Hero
            widget: object
            collapsed: true
            fields:
              - name: kicker
                label: Kicker
                widget: string
              - name: statement
                label: What SiteSeer is
                widget: text
                hint: "One or two plain sentences: what it is and who it is for."
              - name: primary
                label: Main button
                widget: string
              - name: secondary
                label: Second button
                widget: string
              - name: steps
                label: Animated steps
                widget: list
                collapsed: true
                fields:
                  - name: word
                    label: Word
                    widget: string
                    hint: The big word, e.g. "Fast". Shown with a full stop.
                  - name: line
                    label: Line
                    widget: string
                    hint: One short line under the word.
                  - name: kind
                    label: What the model does
                    widget: select
                    options:
                      - build
                      - focus
                      - inspect
                      - pull
                      - finale
                  - name: cam
                    label: Camera
                    widget: object
                    collapsed: true
                    fields:
                      - name: t
                        label: Look at
                        widget: list
                        collapsed: true
                        fields: null
                        field:
                          name: v
                          label: Value
                          widget: number
                          value_type: float
                        min: 3
                        max: 3
                        hint: "Three numbers: x, y, z in metres."
                      - name: az
                        label: Turn (degrees)
                        widget: number
                        value_type: float
                      - name: polar
                        label: Tilt (degrees)
                        widget: number
                        value_type: float
                      - name: r
                        label: Distance (metres)
                        widget: number
                        value_type: float
                    hint: Leave unless you are adjusting the shot.
                  - name: hold
                    label: Hold (ms)
                    widget: number
                    value_type: int
                    required: false
                  - name: focus
                    label: Highlight layer (1–12)
                    widget: number
                    value_type: int
                    required: false
                  - name: inspect
                    label: Inspection points
                    widget: list
                    collapsed: true
                    fields:
                      - name: at
                        label: Position
                        widget: list
                        collapsed: true
                        fields: null
                        field:
                          name: v
                          label: Value
                          widget: number
                          value_type: float
                        min: 3
                        max: 3
                        hint: "Three numbers: x, y, z in metres."
                      - name: kicker
                        label: Label
                        widget: string
                      - name: title
                        label: Title
                        widget: string
                      - name: text
                        label: Text
                        widget: text
                    required: false
                  - name: pulls
                    label: Layer pulls
                    widget: list
                    collapsed: true
                    fields:
                      - name: t
                        label: Starts at (ms)
                        widget: number
                        value_type: int
                      - name: dur
                        label: Lasts (ms)
                        widget: number
                        value_type: int
                      - name: layers
                        label: Layers
                        widget: list
                        collapsed: true
                        fields: null
                        field:
                          name: n
                          label: Layer
                          widget: number
                          value_type: int
                      - name: dv
                        label: Slide (dx, dz metres)
                        widget: list
                        collapsed: true
                        fields: null
                        field:
                          name: v
                          label: Value
                          widget: number
                          value_type: float
                        min: 2
                        max: 2
                      - name: kicker
                        label: Label
                        widget: string
                      - name: title
                        label: Title
                        widget: string
                      - name: text
                        label: Text
                        widget: text
                      - name: refs
                        label: References
                        widget: string
                        required: false
                    required: false
          - name: problem
            label: The problem
            widget: object
            collapsed: true
            fields:
              - name: eyebrow
                label: Eyebrow
                widget: string
              - name: heading
                label: Heading
                widget: string
              - name: lede
                label: Intro
                widget: text
              - name: points
                label: Points
                widget: list
                collapsed: true
                fields: &a1
                  - &a5
                    name: title
                    label: Title
                    widget: string
                  - &a6
                    name: text
                    label: Text
                    widget: text
              - &a2
                name: image
                label: Image file
                widget: string
                hint: A file in src/images/renders, e.g. render-20.jpg.
              - &a3
                name: alt
                label: Alt text
                widget: string
                hint: What the image shows, for people who cannot see it.
              - &a4
                name: caption
                label: Caption
                widget: string
          - name: how
            label: How it works
            widget: object
            collapsed: true
            fields:
              - name: eyebrow
                label: Eyebrow
                widget: string
              - name: heading
                label: Heading
                widget: string
              - name: lede
                label: Intro
                widget: text
              - name: points
                label: Points
                widget: list
                collapsed: true
                fields: *a1
              - name: strip
                label: Images
                widget: list
                collapsed: true
                fields:
                  - *a2
                  - *a3
                  - *a4
          - name: access
            label: Where it runs
            widget: object
            collapsed: true
            fields:
              - name: eyebrow
                label: Eyebrow
                widget: string
              - name: heading
                label: Heading
                widget: string
              - name: lede
                label: Intro
                widget: text
              - name: closing
                label: Closing line
                widget: string
                required: false
              - name: ways
                label: Ways in
                widget: list
                collapsed: true
                fields:
                  - name: icon
                    label: Icon
                    widget: select
                    options:
                      - lab
                      - lms
                      - laptop
                      - phone
                      - tablet
                      - browser
                      - office
                  - name: title
                    label: Title
                    widget: string
                  - name: text
                    label: Text
                    widget: text
                  - name: platforms
                    label: Platforms
                    widget: list
                    required: false
                    hint: Learning platforms to show, one per line.
          - name: uses
            label: Use cases
            widget: object
            collapsed: true
            fields:
              - name: eyebrow
                label: Eyebrow
                widget: string
              - name: heading
                label: Heading
                widget: string
              - name: lede
                label: Intro
                widget: text
              - name: items
                label: Use cases
                widget: list
                collapsed: true
                fields:
                  - name: tag
                    label: Tag
                    widget: string
                  - *a5
                  - *a6
            required: false
          - name: results
            label: Results
            widget: object
            collapsed: true
            fields:
              - name: eyebrow
                label: Eyebrow
                widget: string
              - name: heading
                label: Heading
                widget: string
              - name: lede
                label: Intro
                widget: text
              - name: stats
                label: Stats
                widget: list
                collapsed: true
                fields:
                  - name: num
                    label: Number
                    widget: string
                  - name: suffix
                    label: Suffix
                    widget: string
                    required: false
                  - name: cap
                    label: Caption
                    widget: string
              - name: outcomes
                label: Outcomes
                widget: list
                collapsed: true
                fields: *a1
          - name: partners
            label: Partners
            widget: object
            collapsed: true
            fields:
              - name: eyebrow
                label: Eyebrow
                widget: string
              - name: heading
                label: Heading
                widget: string
              - name: order
                label: Partners shown, in order
                widget: list
                hint: Partner slugs from the Partners list, one per line.
          - name: contact
            label: Contact
            widget: object
            collapsed: true
            fields:
              - name: eyebrow
                label: Eyebrow
                widget: string
              - name: heading
                label: Heading
                widget: string
              - name: lede
                label: Intro
                widget: text
              - name: email
                label: Email address
                widget: string
              - name: primary
                label: Main button
                widget: object
                collapsed: true
                fields:
                  - name: label
                    label: Label
                    widget: string
                  - name: subject
                    label: Email subject
                    widget: string
              - name: secondary
                label: Second button
                widget: object
                collapsed: true
                fields:
                  - name: label
                    label: Label
                    widget: string
                  - name: subject
                    label: Email subject
                    widget: string
          - name: upcoming
            label: Upcoming features
            widget: object
            collapsed: true
            fields:
              - name: heading
                label: Heading
                widget: string
              - name: intro
                label: Intro
                widget: text
              - name: groups
                label: Groups
                widget: list
                collapsed: true
                fields:
                  - name: title
                    label: Group title
                    widget: string
                  - name: items
                    label: Features
                    widget: list
                    collapsed: true
                    fields: *a1
      - name: industry
        label: Industry site
        file: src/content/sites/industry.json
        fields: *a7
  - name: shared
    label: Shared
    files:
      - name: partners
        label: Partners
        file: src/content/partners.json
        fields:
          - name: items
            label: Partners
            widget: list
            collapsed: true
            fields:
              - name: slug
                label: Slug
                widget: string
                hint: Short id used by each site's partner order, e.g. tafe-sa. Do not change once in use.
              - name: name
                label: Name
                widget: string
              - name: role
                label: Role
                widget: string
              - name: group
                label: Group
                widget: select
                options:
                  - Partner
                  - Supported by
              - name: blurb
                label: Blurb
                widget: text
              - name: logo
                label: Logo file
                widget: string
                hint: A file in public/logos, e.g. tafe-sa.svg.
